name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        # Install from the lockfile so CI tests the same dependency closure as
        # production (the previous hand-written list drifted from pyproject).
        # --no-install-project: the app is run as a source tree, not a built package.
        run: uv sync --frozen --no-install-project

      - name: Lint (ruff)
        run: .venv/bin/ruff check backend/

      - name: Tests (pytest)
        run: .venv/bin/python -m pytest -q

  frontend:
    name: Frontend (lint + build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Tests (vitest)
        run: npm run test
